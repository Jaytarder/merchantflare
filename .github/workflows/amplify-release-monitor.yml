name: Monitor MerchantFlare Amplify release

on:
  push:
    branches:
      - agent/app-subdomain-deployment-audit

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::432181126458:role/merchantflare-github-actions-ecs
  AMPLIFY_APP_ID: d2wkvdawpeotl8
  AMPLIFY_BRANCH: main
  TARGET_COMMIT: ff018942b66adbd87b8a985a66dc320ce89e5fce

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for exact Amplify commit
        shell: bash
        run: |
          set -euo pipefail
          aws amplify get-app \
            --app-id "$AMPLIFY_APP_ID" \
            --query 'app.{buildSpec:buildSpec,repository:repository,platform:platform,appRoot:environmentVariables.AMPLIFY_MONOREPO_APP_ROOT,environmentVariableNames:keys(environmentVariables)}'
          aws amplify get-branch \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --query 'branch.{buildSpec:buildSpec,framework:framework,enableAutoBuild:enableAutoBuild,environmentVariableNames:keys(environmentVariables)}'
          for name in AUTH_SESSION_SECRET DATABASE_URL; do
            value="$(aws amplify get-branch \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --query "branch.environmentVariables.${name}" \
              --output text)"
            if [[ -z "$value" || "$value" == "None" ]]; then
              value="$(aws amplify get-app \
                --app-id "$AMPLIFY_APP_ID" \
                --query "app.environmentVariables.${name}" \
                --output text)"
            fi
            if [[ -n "$value" && "$value" != "None" ]]; then
              echo "::add-mask::$value"
            fi
          done

          for attempt in $(seq 1 120); do
            job="$(aws amplify list-jobs \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --max-results 20 \
              --query "jobSummaries[?commitId=='$TARGET_COMMIT'] | [0]" \
              --output json)"
            status="$(JOB="$job" node -e '
              const job = JSON.parse(process.env.JOB);
              process.stdout.write(job?.status ?? "NOT_FOUND");
            ')"
            echo "Amplify job status: $status"
            case "$status" in
              SUCCEED)
                JOB="$job" node -e '
                  const job = JSON.parse(process.env.JOB);
                  console.log(JSON.stringify({
                    jobId: job.jobId,
                    commitId: job.commitId,
                    status: job.status,
                    startTime: job.startTime,
                    endTime: job.endTime,
                  }));
                '
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Amplify release failed with status $status." >&2
                job_id="$(JOB="$job" node -e '
                  const job = JSON.parse(process.env.JOB);
                  process.stdout.write(job.jobId);
                ')"
                detail="$(aws amplify get-job \
                  --app-id "$AMPLIFY_APP_ID" \
                  --branch-name "$AMPLIFY_BRANCH" \
                  --job-id "$job_id" \
                  --output json)"
                DETAIL="$detail" node -e '
                  const detail = JSON.parse(process.env.DETAIL);
                  console.log(JSON.stringify(detail.job.steps.map((step) => ({
                    stepName: step.stepName,
                    status: step.status,
                  }))));
                '
                DETAIL="$detail" node -e '
                  const detail = JSON.parse(process.env.DETAIL);
                  for (const step of detail.job.steps) {
                    if (step.logUrl) process.stdout.write(`${step.stepName}\t${step.logUrl}\n`);
                  }
                ' | while IFS=$'\t' read -r step_name log_url; do
                  echo "::add-mask::$log_url"
                  echo "--- Amplify step: $step_name (error excerpt) ---"
                  curl --fail --silent --show-error "$log_url" \
                    | grep -Ei 'error|failed|failure|npm ERR|cannot|missing|invalid|unsupported|buildspec|appRoot|preBuild|npm ci|executing command|cloning|checking out|source directory|commit|cache|directory' \
                    | tail -n 180 || true
                done
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the Amplify job for $TARGET_COMMIT." >&2
          exit 1
