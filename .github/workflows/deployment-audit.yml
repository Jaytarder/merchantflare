name: Audit MerchantFlare production deployment

on:
  push:
    branches:
      - agent/app-subdomain-deployment-audit
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "432181126458"
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::432181126458:role/merchantflare-github-actions-ecs
  AMPLIFY_APP_ID: d2wkvdawpeotl8
  AMPLIFY_BRANCH: main
  EXPECTED_COGNITO_USER_POOL_ID: us-east-1_Ltn0AeNJD
  EXPECTED_COGNITO_APP_CLIENT_ID: 3s5cv1v92ltlerhuvo53p42cg
  TARGET_OWNER_EMAIL: jmartin@merchantflare.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate application and migrations
        run: |
          npm run typecheck
          npm test
          npm run migrate:dry-run
          npm run build
          git diff --check

      - name: Report safe GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString("utf8"),
            );
            console.log(JSON.stringify({
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              ref: payload.ref,
              job_workflow_ref: payload.job_workflow_ref,
            }));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Amplify configuration without printing values
        shell: bash
        run: |
          set -euo pipefail

          read_amplify_variable() {
            local name="$1"
            local value
            value="$(aws amplify get-branch \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --query "branch.environmentVariables.${name}" \
              --output text)"
            if [[ -z "$value" || "$value" == "None" ]]; then
              value="$(aws amplify get-app \
                --app-id "$AMPLIFY_APP_ID" \
                --query "app.environmentVariables.${name}" \
                --output text)"
            fi
            printf '%s' "$value"
          }

          required=(
            COGNITO_AWS_REGION
            COGNITO_USER_POOL_ID
            COGNITO_APP_CLIENT_ID
            COGNITO_ISSUER_URL
            COGNITO_DOMAIN
            APPLICATION_BASE_URL
            AUTH_SESSION_SECRET
            DATABASE_URL
          )
          configured=()
          for name in "${required[@]}"; do
            value="$(read_amplify_variable "$name")"
            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "Missing Amplify environment variable: $name" >&2
              exit 1
            fi
            echo "::add-mask::$value"
            configured+=("$name")
            printf -v "$name" '%s' "$value"
            export "$name"
          done

          [[ "$APPLICATION_BASE_URL" == "https://app.merchantflare.com" ]]
          [[ ${#AUTH_SESSION_SECRET} -ge 32 ]]
          [[ "$COGNITO_AWS_REGION" == "$AWS_REGION" ]]
          [[ "$COGNITO_USER_POOL_ID" == "$EXPECTED_COGNITO_USER_POOL_ID" ]]
          [[ "$COGNITO_APP_CLIENT_ID" == "$EXPECTED_COGNITO_APP_CLIENT_ID" ]]

          printf 'Configured Amplify variables: %s\n' "${configured[*]}"
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "COGNITO_BOOTSTRAP_SUBJECT_PENDING=true"
          } >> "$GITHUB_ENV"

          aws amplify get-app \
            --app-id "$AMPLIFY_APP_ID" \
            --query 'app.{name:name,repository:repository,platform:platform}'
          aws amplify get-branch \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --query 'branch.{branchName:branchName,stage:stage,framework:framework,enableAutoBuild:enableAutoBuild,activeJobId:activeJobId}'
          aws amplify list-jobs \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --max-results 5 \
            --query 'jobSummaries[].{jobId:jobId,commitId:commitId,status:status,startTime:startTime,endTime:endTime}'
          aws amplify get-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name merchantflare.com \
            --query 'domainAssociation.{domainStatus:domainStatus,updateStatus:updateStatus,subDomains:subDomains[].{prefix:subDomainSetting.prefix,dnsRecord:dnsRecord,verified:verified}}'

      - name: Verify Cognito allowlists and first Owner identity
        shell: bash
        run: |
          set -euo pipefail
          client="$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "$EXPECTED_COGNITO_USER_POOL_ID" \
            --client-id "$EXPECTED_COGNITO_APP_CLIENT_ID" \
            --query 'UserPoolClient.{GenerateSecret:GenerateSecret,CallbackURLs:CallbackURLs,LogoutURLs:LogoutURLs,AllowedOAuthFlows:AllowedOAuthFlows,AllowedOAuthScopes:AllowedOAuthScopes}' \
            --output json)"
          CLIENT="$client" node -e '
            const client = JSON.parse(process.env.CLIENT);
            const callbacks = client.CallbackURLs ?? [];
            const logouts = client.LogoutURLs ?? [];
            if (client.GenerateSecret === true) throw new Error("Browser client has a secret.");
            for (const url of [
              "https://app.merchantflare.com/api/auth/callback",
              "http://localhost:3000/api/auth/callback",
            ]) if (!callbacks.includes(url)) throw new Error(`Missing callback ${url}`);
            for (const url of [
              "https://app.merchantflare.com/login",
              "http://localhost:3000/login",
            ]) if (!logouts.includes(url)) throw new Error(`Missing logout ${url}`);
            console.log(JSON.stringify(client));
          '

          owner="$(aws cognito-idp admin-get-user \
            --user-pool-id "$EXPECTED_COGNITO_USER_POOL_ID" \
            --username "$TARGET_OWNER_EMAIL" \
            --output json)"
          COGNITO_BOOTSTRAP_SUBJECT="$(OWNER="$owner" TARGET_OWNER_EMAIL="$TARGET_OWNER_EMAIL" node -e '
            const user = JSON.parse(process.env.OWNER);
            const attributes = Object.fromEntries(user.UserAttributes.map((item) => [item.Name, item.Value]));
            if (attributes.email?.toLowerCase() !== process.env.TARGET_OWNER_EMAIL.toLowerCase()) throw new Error("Cognito email does not match.");
            if (attributes.email_verified !== "true") throw new Error("Cognito email is not verified.");
            if (!attributes.sub) throw new Error("Cognito sub is missing.");
            process.stdout.write(attributes.sub);
          ')"
          echo "::add-mask::$COGNITO_BOOTSTRAP_SUBJECT"
          echo "COGNITO_BOOTSTRAP_SUBJECT=$COGNITO_BOOTSTRAP_SUBJECT" >> "$GITHUB_ENV"
          echo "Cognito Owner identity exists and has a verified email."

      - name: Audit database migrations, isolation, and Owner membership
        env:
          NODE_ENV: production
        run: npm run deployment:audit

      - name: Identify managed database backup target
        shell: bash
        run: |
          set -euo pipefail
          db_host="$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).hostname)')"
          echo "::add-mask::$db_host"

          clusters="$(aws rds describe-db-clusters \
            --query "DBClusters[?Endpoint=='$db_host' || ReaderEndpoint=='$db_host'].{type:'cluster',identifier:DBClusterIdentifier,arn:DBClusterArn,engine:Engine,status:Status,deletionProtection:DeletionProtection,backupRetentionPeriod:BackupRetentionPeriod}" \
            --output json)"
          instances="$(aws rds describe-db-instances \
            --query "DBInstances[?Endpoint.Address=='$db_host'].{type:'instance',identifier:DBInstanceIdentifier,arn:DBInstanceArn,engine:Engine,status:DBInstanceStatus,deletionProtection:DeletionProtection,backupRetentionPeriod:BackupRetentionPeriod}" \
            --output json)"

          CLUSTERS="$clusters" INSTANCES="$instances" node -e '
            const resources = [
              ...JSON.parse(process.env.CLUSTERS),
              ...JSON.parse(process.env.INSTANCES),
            ];
            if (resources.length !== 1) {
              throw new Error(`Expected one RDS or Aurora backup target; found ${resources.length}.`);
            }
            console.log(JSON.stringify(resources[0]));
          '
