<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 249" role="img" aria-labelledby="title desc">
  <title id="title">MerchantFlare</title>
  <desc id="desc">MerchantFlare logo with a silver angular M, orange growth arrow, and the tagline The AI Workforce for Commerce.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f4f4f5"/>
      <stop offset="0.72" stop-color="#c8c9cc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="0.55" stop-color="#ff8a16"/>
      <stop offset="1" stop-color="#ff9f31"/>
    </linearGradient>
    <radialGradient id="backGlow" cx="24%" cy="40%" r="75%">
      <stop offset="0" stop-color="#131417"/>
      <stop offset="0.55" stop-color="#090a0c"/>
      <stop offset="1" stop-color="#030405"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="screen"/>
    </filter>
  </defs>

  <rect width="846" height="249" rx="2" fill="url(#backGlow)"/>
  <rect width="846" height="249" rx="2" fill="transparent" filter="url(#grain)"/>

  <g transform="translate(27 41)">
    <path d="M5 133V25L70 93L136 25V133" fill="none" stroke="url(#metal)" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" filter="url(#softGlow)"/>
    <path d="M38 133L145 9" fill="none" stroke="url(#flare)" stroke-width="12" stroke-linecap="square" filter="url(#softGlow)"/>
    <path d="M139 10L169 0L158 30Z" fill="url(#flare)" filter="url(#softGlow)"/>
    <rect x="188" y="18" width="2.5" height="116" fill="url(#flare)"/>

    <g transform="translate(230 27)" font-family="Montserrat, Avenir Next, Arial, Helvetica, sans-serif">
      <text x="0" y="51" fill="url(#metal)" font-size="43" font-weight="600" letter-spacing="8.1">MERCHANT<tspan fill="url(#flare)">FLARE</tspan></text>
      <text x="2" y="88" fill="#f0f0f2" font-size="19" font-weight="500" letter-spacing="5.15">THE AI WORKFORCE FOR COMMERCE</text>
    </g>
  </g>
</svg>
